[project]
name = "pumpd"
version = "1.1.0"
description = "Rooftop rain pump controller"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "paho-mqtt>=2,<3",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-multipart>=0.0.9",
    "pyyaml>=6,<7",
    "sqlalchemy>=2,<3",
    "tinytuya>=1.13,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[[tool.mypy.overrides]]
module = ["tinytuya.*", "apscheduler.*", "paho.*", "app.web.routes"]
ignore_missing_imports = true
disable_error_code = ["arg-type", "call-overload", "unused-ignore"]
