services:
  pumpd:
    build: .
    ports:
      - "8081:8080"
    volumes:
      - pumpd-data:/app/data
      - ./config.yaml:/app/config.yaml
      - ./credentials:/app/credentials
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  # Phase 2 — uncomment when rain sensor is ready
