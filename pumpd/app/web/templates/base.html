<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}pumpd{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    :root {
      font-family: system-ui, -apple-system, sans-serif;
      color: #1a1a1a;
      background: #f4f6f8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --admin-accent: #7c3aed;
      --user-accent: #059669;
    }
    * { box-sizing: border-box; }
    body { max-width: 960px; margin: 0 auto; padding: 1rem; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 1.25rem; }
    .brand { display: flex; align-items: center; gap: 0.85rem; min-width: 0; }
    .site-logo {
      display: block;
      height: 52px;
      width: auto;
      max-width: min(220px, 40vw);
      object-fit: contain;
      flex-shrink: 0;
    }
    .brand-text { min-width: 0; }
    header h1 { margin: 0; font-size: 1.5rem; }
    .subtitle { color: #555; margin: 0.15rem 0 0; font-size: 0.9rem; }
    nav { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    nav a {
      text-decoration: none;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
      background: #fff;
      border: 1px solid #e5e7eb;
    }
    nav a:hover { background: #f9fafb; }
    nav a.active { color: #fff; border-color: transparent; }
    nav a.nav-user.active { background: var(--user-accent); }
    nav a.nav-admin.active { background: var(--admin-accent); }
    .card { background: #fff; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card h2 { margin: 0 0 0.75rem; font-size: 1.05rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
    .badge { display: inline-block; padding: 0.2rem 0.55rem; border-radius: 4px; font-size: 0.85rem; font-weight: 500; }
    .badge.on, .badge.ok, .badge.running, .badge.online { background: #d1fae5; color: #065f46; }
    .badge.off, .badge.idle, .badge.unconfigured { background: #f3f4f6; color: #4b5563; }
    .badge.warn, .badge.degraded, .badge.unknown { background: #fef3c7; color: #92400e; }
    .badge.fault, .badge.fail, .badge.offline { background: #fee2e2; color: #991b1b; }
    .badge.cloud_error { background: #fef3c7; color: #92400e; }
    .badge.drain { background: #dbeafe; color: #1e40af; }
    .badge.manual { background: #ede9fe; color: #5b21b6; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    td, th { text-align: left; padding: 0.4rem 0.35rem; border-bottom: 1px solid #eee; }
    th { color: #6b7280; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.02em; }
    button, .btn {
      margin-right: 0.35rem;
      margin-bottom: 0.35rem;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      font-size: 0.875rem;
    }
    button:hover, .btn:hover { background: #f9fafb; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { background: var(--accent-hover); }
    button.danger { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
    .pump-mode-buttons { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
    .pump-mode-buttons .mode-btn { margin: 0; }
    .manual-control-scope { margin: 0.65rem 0; }
    .manual-control {
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 0.55rem 0.65rem;
      margin: 0;
    }
    .manual-control-legend {
      font-size: 0.78rem;
      font-weight: 600;
      color: #6b7280;
      padding: 0 0.25rem;
    }
    .manual-duration-row,
    .manual-limit-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: center;
      margin-top: 0.35rem;
    }
    .manual-duration-row label,
    .manual-limit-option {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.82rem;
      color: #374151;
    }
    .manual-duration-row input[type="number"] {
      width: 4rem;
      padding: 0.25rem 0.4rem;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 0.82rem;
    }
    .manual-control-hint { margin: 0.45rem 0 0; }
    .manual-expires { margin: 0.35rem 0 0.5rem; }
    .manual-control-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
      margin-top: 0.55rem;
    }
    .manual-cancel-btn {
      background: transparent;
      border-color: #d1d5db;
      color: #6b7280;
      font-size: 0.82rem;
      padding: 0.35rem 0.65rem;
    }
    .manual-control-scope.is-open .manual-control-panel { display: block; }
    .manual-control-panel[hidden] { display: none !important; }
    button.mode-btn.is-active {
      font-weight: 600;
      box-shadow: inset 0 0 0 2px currentColor;
    }
    button.mode-btn.mode-auto.is-active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }
    button.mode-btn.mode-on.is-active {
      background: #ede9fe;
      border-color: #7c3aed;
      color: #5b21b6;
    }
    button.mode-btn.mode-off.is-active {
      background: #fef2f2;
      border-color: #dc2626;
      color: #991b1b;
    }
    button.mode-btn.htmx-request {
      opacity: 1;
      cursor: wait;
      pointer-events: none;
      font-weight: 600;
      padding-left: 1.85rem;
      position: relative;
    }
    button.mode-btn.htmx-request::before {
      content: '';
      position: absolute;
      left: 0.55rem;
      top: 50%;
      width: 0.85rem;
      height: 0.85rem;
      margin-top: -0.425rem;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      opacity: 0.85;
      animation: cmd-spin 0.7s linear infinite;
    }
    button.mode-btn.htmx-request.is-active {
      opacity: 1;
    }
    .pump-card-busy .pump-mode-buttons .mode-btn:not(.htmx-request),
    .pump-card-busy .pump-card-quick-actions .mode-btn:not(.htmx-request) {
      opacity: 0.45;
      pointer-events: none;
    }
    .pump-device-busy .pump-device-quick-actions .mode-btn:not(.htmx-request),
    .pump-device-busy .pump-device-switches .mode-btn:not(.htmx-request) {
      opacity: 0.45;
      pointer-events: none;
    }
    .pump-command-status {
      display: none;
      margin: 0.55rem 0 0;
      padding: 0.55rem 0.7rem;
      border-radius: 6px;
      font-size: 0.875rem;
      line-height: 1.35;
    }
    .pump-command-status.is-pending {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
    }
    .pump-command-status.is-pending.is-retry-hint {
      background: #fffbeb;
      border-color: #fcd34d;
      color: #92400e;
    }
    .pump-command-status.is-ok {
      display: block;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
    }
    .pump-command-status.is-error {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
    .cmd-spinner {
      flex-shrink: 0;
      width: 0.95rem;
      height: 0.95rem;
      border: 2px solid #93c5fd;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: cmd-spin 0.7s linear infinite;
    }
    @keyframes cmd-spin { to { transform: rotate(360deg); } }
    .meta { color: #6b7280; font-size: 0.875rem; margin: 0.25rem 0; }
    .forecast-bar { display: flex; gap: 2px; height: 48px; align-items: flex-end; }
    .forecast-bar span { flex: 1; background: #93c5fd; border-radius: 2px 2px 0 0; min-height: 4px; }
    .location-name { font-size: 1.15rem; font-weight: 600; margin: 0.25rem 0; }
    .location-weather-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 1.75rem;
    }
    .lw-location {
      flex: 1 1 160px;
      min-width: 0;
    }
    .lw-conditions {
      flex: 2 1 260px;
      min-width: 0;
    }
    .lw-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #6b7280;
      font-weight: 600;
      margin: 0 0 0.35rem;
    }
    .location-weather-row .current-row { gap: 0.85rem; }
    .location-weather-row .rain-badge-col { margin-left: auto; }
    .current-row { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; }
    .weather-icon-lg { font-size: 2.75rem; line-height: 1; }
    .current-temp { font-size: 2rem; font-weight: 600; margin: 0; }
    .rain-badge-col { margin-left: auto; text-align: right; }
    .forecast-labeled { display: flex; gap: 4px; align-items: flex-end; overflow-x: auto; padding-bottom: 0.25rem; }
    .forecast-hour { display: flex; flex-direction: column; align-items: center; min-width: 36px; font-size: 0.7rem; color: #6b7280; }
    .forecast-bar-mini { width: 100%; background: #93c5fd; border-radius: 2px 2px 0 0; min-height: 4px; }
    .forecast-time { margin-top: 0.25rem; font-weight: 600; color: #374151; }
    .forecast-pop { color: #2563eb; }
    .forecast-week { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 0.5rem; }
    .forecast-day { display: flex; flex-direction: column; align-items: center; padding: 0.5rem; background: #f9fafb; border-radius: 6px; font-size: 0.8rem; text-align: center; gap: 0.15rem; }
    .day-name { font-weight: 600; color: #374151; }
    .day-icon { font-size: 1.5rem; }
    .day-temps { color: #4b5563; }
    .day-rain { color: #2563eb; font-weight: 500; }
    .day-mm { color: #6b7280; font-size: 0.75rem; }
    .health-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; }
    .health-item { padding: 0.65rem; background: #f9fafb; border-radius: 6px; text-align: center; }
    .health-item .label { font-size: 0.75rem; color: #6b7280; text-transform: uppercase; }
    .health-item .value { font-size: 1.1rem; font-weight: 600; margin-top: 0.25rem; }
    .override-box { margin-top: 0.75rem; padding: 0.65rem; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 6px; font-size: 0.85rem; }
    .override-box label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }
    .pump-card-collapsible { padding: 0.65rem 0.85rem; margin-bottom: 0.5rem; }
    .pump-card-collapsible .card h2 { margin: 0; }
    .pump-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      flex-wrap: wrap;
    }
    .pump-card-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }
    .pump-card-toggle:hover .pump-card-title { color: var(--accent); }
    .pump-card-arrow {
      display: inline-block;
      color: #6b7280;
      font-size: 0.7rem;
      line-height: 1;
      transition: transform 0.15s ease;
    }
    .pump-card-collapsible.is-expanded .pump-card-arrow { transform: rotate(90deg); }
    .pump-card-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      align-items: center;
      margin-left: auto;
    }
    .pump-card-summary .badge { font-size: 0.78rem; padding: 0.15rem 0.45rem; }
    .pump-power-badge {
      font-weight: 700;
      font-size: 0.88rem !important;
      padding: 0.2rem 0.55rem !important;
      letter-spacing: 0.03em;
    }
    .pump-card-quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.55rem;
    }
    .pump-card-quick-actions .mode-btn-compact {
      margin: 0;
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
    }
    .pump-card-collapsible .pump-command-status { margin-top: 0.45rem; margin-bottom: 0; }
    .device-probe-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem;
      margin: 0.75rem 0 0.5rem;
    }
    .device-probe-bar .probe-devices-status { min-height: 1.25rem; }
    .device-probe-bar .auto-mode-btn {
      background: #ecfdf5;
      color: #047857;
      border-color: #6ee7b7;
    }
    .device-probe-bar .auto-mode-btn:hover {
      background: #d1fae5;
    }
    .device-probe-bar .drain-puddles-btn {
      background: #dbeafe;
      color: #1e40af;
      border-color: #93c5fd;
    }
    .device-probe-bar .drain-puddles-btn:hover {
      background: #bfdbfe;
    }
    .pump-card-details {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid #eee;
    }
    .pump-card-collapsible:not(.is-expanded) .pump-card-details { display: none; }
    .grid-compact { grid-template-columns: 1fr; gap: 0.5rem; }
    .pump-device-group { padding: 0.85rem; }
    .pump-device-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .pump-device-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }
    .pump-device-toggle:hover .pump-device-group-title { color: var(--accent); }
    .pump-device-collapsible.is-expanded .pump-device-toggle .pump-card-arrow {
      transform: rotate(90deg);
    }
    .pump-device-group-title {
      margin: 0;
      font-size: 1.05rem;
    }
    .pump-device-group-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: auto;
    }
    .pump-device-circuit-status {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.65rem;
      align-items: center;
    }
    .pump-device-circuit-item {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }
    .pump-device-circuit-label {
      font-size: 0.78rem;
      color: #4b5563;
      max-width: 8rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pump-device-circuit-item .badge {
      font-size: 0.72rem;
      padding: 0.12rem 0.4rem;
    }
    .pump-device-collapsible.is-expanded .pump-device-circuit-status {
      display: none;
    }
    .pump-device-quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.55rem;
    }
    .pump-device-quick-actions .mode-btn-compact {
      margin: 0;
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
    }
    .pump-device-collapsible.is-expanded .pump-device-quick-actions,
    .pump-device-collapsible.is-expanded .pump-device-command-status {
      display: none;
    }
    .pump-device-command-status {
      display: none;
      margin: 0.45rem 0 0;
      padding: 0.55rem 0.7rem;
      border-radius: 6px;
      font-size: 0.875rem;
      line-height: 1.35;
    }
    .pump-device-command-status.is-pending,
    .pump-device-command-status.is-ok,
    .pump-device-command-status.is-error {
      display: block;
    }
    .pump-device-collapsible.is-expanded .pump-device-switches {
      display: flex;
      margin-top: 0.65rem;
      padding-top: 0.65rem;
      border-top: 1px solid #e5e7eb;
    }
    .pump-device-collapsible:not(.is-expanded) .pump-device-switches { display: none; }
    .pump-device-switches {
      flex-direction: column;
      gap: 0.45rem;
    }
    .pump-card-nested {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 0.55rem 0.7rem;
      margin-bottom: 0;
    }
    .pump-card-nested .pump-card-toggle { font-size: 0.92rem; }
    .pump-card-nested .pump-card-summary .badge { font-size: 0.72rem; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <div class="brand">
      <a href="/user" title="N·E·W Christian Academy">
        <img
          src="/static/images/newca-logo.png"
          alt="N·E·W Christian Academy"
          class="site-logo"
        >
      </a>
      <div class="brand-text">
        <h1>{% block heading %}Rain Roof Pumps{% endblock %}</h1>
        <p class="subtitle">{% block subtitle %}Rain pump controller{% endblock %}</p>
      </div>
    </div>
    <nav>
      <a href="/user" class="nav-user {% if active_nav == 'user' %}active{% endif %}">User</a>
      <a href="/admin" class="nav-admin {% if active_nav == 'admin' %}active{% endif %}">Admin</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
  <script>
  (function() {
    function controlTarget() {
      const mode = document.body.dataset.controlMode || 'auto';
      if (mode === 'cloud') return 'Tuya cloud';
      if (mode === 'local') return 'the device on your network';
      return 'the device (cloud or local)';
    }

    function modeLabel(btn) {
      return btn.dataset.modeAction || btn.textContent.trim();
    }

    function getCommandScope(btn) {
      return btn.closest('.pump-card') || btn.closest('.pump-device-collapsible');
    }

    function getStatusEl(scope) {
      if (!scope) return null;
      return (
        scope.querySelector('.pump-command-status')
        || scope.querySelector('.pump-device-command-status')
      );
    }

    function setScopeBusy(scope, busy) {
      if (!scope) return;
      scope.classList.toggle('pump-card-busy', busy && scope.classList.contains('pump-card'));
      scope.classList.toggle('pump-device-busy', busy && scope.classList.contains('pump-device-collapsible'));
    }

    function restoreButtonLabel(btn) {
      if (btn.dataset.originalLabel) {
        btn.textContent = btn.dataset.originalLabel;
      }
    }

    function commandWaitHintMs() {
      const waitMs = Number(document.body.dataset.commandWaitHintMs);
      if (Number.isFinite(waitMs) && waitMs > 0) {
        return waitMs;
      }
      const sendMs = Number(document.body.dataset.commandTimeoutMs);
      return Number.isFinite(sendMs) && sendMs > 0 ? sendMs + 15000 : 25000;
    }

    function commandTimeoutMs() {
      const ms = Number(document.body.dataset.commandTimeoutMs);
      return Number.isFinite(ms) && ms > 0 ? ms : 20000;
    }

    function showWaitHint(scope, status, actionLabel) {
      const statusClass = scope.classList.contains('pump-device-collapsible')
        ? 'pump-device-command-status'
        : 'pump-command-status';
      status.className = statusClass + ' is-pending is-retry-hint';
      status.innerHTML =
        '<span class="cmd-spinner" aria-hidden="true"></span>' +
        '<span>Waiting for Tuya cloud to confirm <strong>' + actionLabel +
        '</strong> on ' + controlTarget() + '…</span>';
    }

    function clearCommandHintTimer(btn) {
      const timerId = btn.dataset.commandHintTimer;
      if (timerId) {
        clearTimeout(Number(timerId));
        delete btn.dataset.commandHintTimer;
      }
    }

    function parseResponseBody(xhr) {
      if (!xhr || !xhr.responseText) return null;
      try {
        return JSON.parse(xhr.responseText);
      } catch (_) {
        return null;
      }
    }

    function formatErrorMessage(xhr) {
      const body = parseResponseBody(xhr);
      if (body && typeof body.detail === 'string') {
        return body.detail;
      }
      if (body && body.detail && typeof body.detail.message === 'string') {
        return body.detail.message;
      }
      return 'Command failed — please try again';
    }

    function mergeManualRequestParams(parameters, payload) {
      if (!parameters || !payload) return;
      Object.keys(payload).forEach(function(key) {
        parameters[key] = payload[key];
      });
    }

    document.body.addEventListener('htmx:configRequest', function(evt) {
      const btn = evt.target;
      if (!btn || !btn.classList) return;

      let payload = null;
      if (btn.classList.contains('manual-apply-btn')) {
        payload = btn.closest('.pump-device-group')
          ? window.deviceGroupManualApplyPayload(btn)
          : window.pumpManualApplyPayload(btn);
      } else if (btn.dataset && btn.dataset.manualMode) {
        payload = btn.closest('.pump-device-quick-actions')
          ? window.deviceGroupManualPayload(btn, btn.dataset.manualMode)
          : window.pumpManualPayload(btn, btn.dataset.manualMode);
      }
      if (payload) {
        mergeManualRequestParams(evt.detail.parameters, payload);
      }
    });

    document.body.addEventListener('htmx:beforeRequest', function(evt) {
      const btn = evt.detail.elt;
      if (btn.dataset && btn.dataset.manualMode) {
        window.openManualControlPanel(btn);
      }
      if (!btn.classList || !btn.classList.contains('mode-btn')) return;

      const scope = getCommandScope(btn);
      const status = getStatusEl(scope);
      if (!scope || !status) return;

      if (!btn.dataset.originalLabel) {
        btn.dataset.originalLabel = btn.textContent.trim();
      }
      btn.textContent = 'Sending…';

      setScopeBusy(scope, true);
      status.hidden = false;
      status.className = (scope.classList.contains('pump-device-collapsible')
        ? 'pump-device-command-status'
        : 'pump-command-status') + ' is-pending';
      status.innerHTML =
        '<span class="cmd-spinner" aria-hidden="true"></span>' +
        '<span>Sending <strong>' + modeLabel(btn) + '</strong> — waiting for response from ' +
        controlTarget() + '…</span>';

      clearCommandHintTimer(btn);
      btn.dataset.commandHintTimer = String(setTimeout(function() {
        if (scope.classList.contains('pump-card-busy') || scope.classList.contains('pump-device-busy')) {
          showWaitHint(scope, status, modeLabel(btn));
        }
      }, commandWaitHintMs()));
    });

    document.body.addEventListener('htmx:afterRequest', function(evt) {
      const btn = evt.detail.elt;
      if (!btn.classList || !btn.classList.contains('mode-btn')) return;

      const scope = getCommandScope(btn);
      const status = getStatusEl(scope);
      if (!scope || !status) return;

      clearCommandHintTimer(btn);
      restoreButtonLabel(btn);
      setScopeBusy(scope, false);

      const statusClass = scope.classList.contains('pump-device-collapsible')
        ? 'pump-device-command-status'
        : 'pump-command-status';
      const body = parseResponseBody(evt.detail.xhr);

      if (evt.detail.successful) {
        status.className = statusClass + ' is-ok';
        if (body && body.command && body.command.retried) {
          status.textContent = body.command.message || 'Command succeeded after retry — updating status…';
        } else if (body && body.pumps) {
          status.textContent = 'All outlets updated — refreshing status…';
        } else {
          status.textContent = 'Command accepted — updating status…';
        }
        return;
      }

      status.className = statusClass + ' is-error';
      status.textContent = formatErrorMessage(evt.detail.xhr);
    });

    var PUMP_EXPANDED_KEY = 'pumpCardExpanded';
    var DEVICE_EXPANDED_KEY = 'pumpDeviceExpanded';

    function getExpandedPumps() {
      try {
        return new Set(JSON.parse(sessionStorage.getItem(PUMP_EXPANDED_KEY) || '[]'));
      } catch (_) {
        return new Set();
      }
    }

    function getExpandedDevices() {
      try {
        return new Set(JSON.parse(sessionStorage.getItem(DEVICE_EXPANDED_KEY) || '[]'));
      } catch (_) {
        return new Set();
      }
    }

    function saveExpandedPumps(set) {
      sessionStorage.setItem(PUMP_EXPANDED_KEY, JSON.stringify(Array.from(set)));
    }

    function saveExpandedDevices(set) {
      sessionStorage.setItem(DEVICE_EXPANDED_KEY, JSON.stringify(Array.from(set)));
    }

    function captureExpandedStateFromDom(root) {
      if (!root) return;
      var pumps = getExpandedPumps();
      root.querySelectorAll('.pump-card-collapsible.is-expanded').forEach(function(card) {
        var name = card.dataset.pumpName;
        if (name) pumps.add(name);
      });
      saveExpandedPumps(pumps);

      var devices = getExpandedDevices();
      root.querySelectorAll('.pump-device-collapsible.is-expanded').forEach(function(group) {
        var key = group.dataset.deviceKey;
        if (key) devices.add(key);
      });
      saveExpandedDevices(devices);
    }

    function applyPumpCardExpandedState(root) {
      if (!root) return;
      var expanded = getExpandedPumps();
      root.querySelectorAll('.pump-card-collapsible').forEach(function(card) {
        var name = card.dataset.pumpName;
        var isExpanded = expanded.has(name);
        card.classList.toggle('is-expanded', isExpanded);
        var btn = card.querySelector('.pump-card-toggle');
        if (btn) btn.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
      });
    }

    function applyDeviceGroupExpandedState(root) {
      if (!root) return;
      var expanded = getExpandedDevices();
      root.querySelectorAll('.pump-device-collapsible').forEach(function(group) {
        var key = group.dataset.deviceKey;
        var isExpanded = expanded.has(key);
        group.classList.toggle('is-expanded', isExpanded);
        var btn = group.querySelector('.pump-device-toggle');
        if (btn) btn.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
      });
    }

    function applyDashboardExpandedState(root) {
      applyPumpCardExpandedState(root);
      applyDeviceGroupExpandedState(root);
    }

    function isStatusPanelNode(node) {
      return node && node.id === 'status-panel';
    }

    function handleStatusPanelRefresh(root) {
      if (!root) root = document.getElementById('status-panel');
      if (!root) return;
      applyDashboardExpandedState(root);
      if (window.closeManualControlPanels) window.closeManualControlPanels(root);
    }

    var probeDevicesInFlight = false;
    var manualDrainInFlight = false;
    var revertAllAutoInFlight = false;

    async function probeAllDeviceConnections(statusEl) {
      if (probeDevicesInFlight) return;
      probeDevicesInFlight = true;
      if (statusEl) statusEl.textContent = 'Checking device connections…';
      try {
        var response = await fetch('/api/devices/probe-status', { method: 'POST' });
        if (!response.ok) {
          if (statusEl) statusEl.textContent = 'Connection check failed.';
          return;
        }
        var data = await response.json();
        if (statusEl && data.message) statusEl.textContent = data.message;
        if (window.htmx) htmx.trigger('#status-panel', 'load');
      } catch (err) {
        if (statusEl) statusEl.textContent = 'Connection check failed.';
      } finally {
        probeDevicesInFlight = false;
      }
    }

    async function revertAllToAuto(statusEl) {
      if (revertAllAutoInFlight) return;
      revertAllAutoInFlight = true;
      if (statusEl) statusEl.textContent = 'Restoring automatic control…';
      try {
        var response = await fetch('/api/auto/start', { method: 'POST' });
        if (!response.ok) {
          if (statusEl) statusEl.textContent = 'Failed to restore automatic mode.';
          return;
        }
        var data = await response.json();
        if (statusEl && data.message) statusEl.textContent = data.message;
        if (window.htmx) htmx.trigger('#status-panel', 'load');
      } catch (err) {
        if (statusEl) statusEl.textContent = 'Failed to restore automatic mode.';
      } finally {
        revertAllAutoInFlight = false;
      }
    }

    async function startManualDrain(statusEl) {
      if (manualDrainInFlight) return;
      manualDrainInFlight = true;
      if (statusEl) statusEl.textContent = 'Starting drain…';
      try {
        var response = await fetch('/api/drain/start', { method: 'POST' });
        if (!response.ok) {
          if (statusEl) statusEl.textContent = 'Drain failed to start.';
          return;
        }
        var data = await response.json();
        if (statusEl && data.message) statusEl.textContent = data.message;
        if (window.htmx) htmx.trigger('#status-panel', 'load');
      } catch (err) {
        if (statusEl) statusEl.textContent = 'Drain failed to start.';
      } finally {
        manualDrainInFlight = false;
      }
    }

    document.body.addEventListener('click', function(evt) {
      var probeBtn = evt.target.closest('.probe-devices-btn');
      if (probeBtn) {
        var bar = probeBtn.closest('.device-probe-bar');
        var statusEl = bar ? bar.querySelector('.probe-devices-status') : null;
        probeAllDeviceConnections(statusEl);
        return;
      }

      var drainBtn = evt.target.closest('.drain-puddles-btn');
      if (drainBtn) {
        var drainBar = drainBtn.closest('.device-probe-bar');
        var drainStatusEl = drainBar ? drainBar.querySelector('.probe-devices-status') : null;
        startManualDrain(drainStatusEl);
        return;
      }

      var autoBtn = evt.target.closest('.auto-mode-btn');
      if (autoBtn) {
        var autoBar = autoBtn.closest('.device-probe-bar');
        var autoStatusEl = autoBar ? autoBar.querySelector('.probe-devices-status') : null;
        revertAllToAuto(autoStatusEl);
        return;
      }

      var deviceBtn = evt.target.closest('.pump-device-toggle');
      if (deviceBtn) {
        var group = deviceBtn.closest('.pump-device-collapsible');
        if (!group) return;
        var deviceKey = group.dataset.deviceKey;
        var deviceExpanded = getExpandedDevices();
        var deviceNowExpanded = !group.classList.contains('is-expanded');
        group.classList.toggle('is-expanded', deviceNowExpanded);
        deviceBtn.setAttribute('aria-expanded', deviceNowExpanded ? 'true' : 'false');
        if (deviceNowExpanded) deviceExpanded.add(deviceKey);
        else deviceExpanded.delete(deviceKey);
        saveExpandedDevices(deviceExpanded);
        return;
      }

      var btn = evt.target.closest('.pump-card-toggle');
      if (!btn) return;
      var card = btn.closest('.pump-card-collapsible');
      if (!card) return;
      var name = card.dataset.pumpName;
      var expanded = getExpandedPumps();
      var nowExpanded = !card.classList.contains('is-expanded');
      card.classList.toggle('is-expanded', nowExpanded);
      btn.setAttribute('aria-expanded', nowExpanded ? 'true' : 'false');
      if (nowExpanded) expanded.add(name);
      else expanded.delete(name);
      saveExpandedPumps(expanded);
    });

    document.body.addEventListener('htmx:beforeSwap', function(evt) {
      if (isStatusPanelNode(evt.detail.target)) {
        captureExpandedStateFromDom(evt.detail.target);
      }
    });

    document.body.addEventListener('htmx:afterSwap', function(evt) {
      if (isStatusPanelNode(evt.detail.target)) {
        handleStatusPanelRefresh(evt.detail.target);
      }
    });

    document.body.addEventListener('htmx:afterSettle', function(evt) {
      if (isStatusPanelNode(evt.detail.target)) {
        handleStatusPanelRefresh(evt.detail.target);
      }
    });

    handleStatusPanelRefresh(document.getElementById('status-panel'));

    window.manualControlScopeFor = function(btn) {
      var card = btn.closest('.pump-card, .pump-card-nested, .name-edit-scope, .pump-device-group');
      return card ? card.querySelector('.manual-control-scope') : null;
    };

    window.findManualControlScope = function(btn) {
      var scope = btn.closest('.manual-control-scope');
      if (scope) return scope;
      return window.manualControlScopeFor(btn);
    };

    window.manualPayloadFromScope = function(scope, mode) {
      var payload = { mode: mode };
      if (!scope) return payload;
      var hoursEl = scope.querySelector('.manual-hours');
      var minutesEl = scope.querySelector('.manual-minutes');
      var untilAutoEl = scope.querySelector('.manual-limit-auto');
      payload.manual_hours = parseInt(hoursEl && hoursEl.value ? hoursEl.value : '0', 10) || 0;
      payload.manual_minutes = parseInt(minutesEl && minutesEl.value ? minutesEl.value : '0', 10) || 0;
      payload.manual_until_auto = !!(untilAutoEl && untilAutoEl.checked);
      return payload;
    };

    window.pumpManualPayload = function(btn, mode) {
      var scope = window.findManualControlScope(btn);
      var payload = window.manualPayloadFromScope(scope, mode);
      if (btn.dataset.manualOverride === 'true') {
        var pumpName = scope && scope.dataset.pumpName;
        var overrideEl = pumpName ? document.getElementById('override-' + pumpName) : null;
        payload.approve_safety_override = !!(overrideEl && overrideEl.checked);
      }
      return payload;
    };

    window.deviceGroupManualPayload = function(btn, mode) {
      var group = btn.closest('.pump-device-group');
      var scope = group ? group.querySelector('.manual-control-scope') : null;
      var payload = window.manualPayloadFromScope(scope, mode);
      if (group) {
        payload.device_backend = group.dataset.deviceBackend || '';
        payload.device_id = group.dataset.deviceId || '';
      }
      return payload;
    };

    window.closeManualControlPanel = function(el) {
      var scope = (el && el.classList && el.classList.contains('manual-control-scope'))
        ? el
        : (el && el.closest ? el.closest('.manual-control-scope') : null);
      if (!scope) return;
      var panel = scope.querySelector('.manual-control-panel');
      scope.classList.remove('is-open');
      delete scope.dataset.pendingMode;
      delete scope.dataset.manualOverride;
      if (panel) panel.hidden = true;
    };

    window.closeManualControlPanels = function(root) {
      var container = root || document;
      container.querySelectorAll('.manual-control-scope.is-open').forEach(function(scope) {
        window.closeManualControlPanel(scope);
      });
    };

    window.openManualControlPanel = function(trigger) {
      var scope = window.manualControlScopeFor(trigger);
      if (!scope) return;
      var mode = trigger.dataset.manualMode;
      if (!mode) return;

      window.closeManualControlPanels();

      var card = trigger.closest('.pump-card-collapsible');
      if (card && !card.classList.contains('is-expanded')) {
        card.classList.add('is-expanded');
        var toggle = card.querySelector('.pump-card-toggle');
        if (toggle) toggle.setAttribute('aria-expanded', 'true');
        var name = card.dataset.pumpName;
        if (name) {
          var pumps = getExpandedPumps();
          pumps.add(name);
          saveExpandedPumps(pumps);
        }
      }

      scope.dataset.pendingMode = mode;
      if (trigger.dataset.manualOverride === 'true') {
        scope.dataset.manualOverride = 'true';
      } else {
        delete scope.dataset.manualOverride;
      }

      var panel = scope.querySelector('.manual-control-panel');
      if (panel) panel.hidden = false;
      scope.classList.add('is-open');

      var applyBtn = scope.querySelector('.manual-apply-btn');
      if (applyBtn) {
        applyBtn.classList.remove('mode-on', 'mode-off');
        applyBtn.classList.add(mode === 'manual_on' ? 'mode-on' : 'mode-off');
      }
    };

    window.pumpManualApplyPayload = function(applyBtn) {
      var scope = applyBtn.closest('.manual-control-scope');
      var mode = scope && scope.dataset.pendingMode ? scope.dataset.pendingMode : 'manual_on';
      var payload = window.manualPayloadFromScope(scope, mode);
      if (scope && scope.dataset.manualOverride === 'true') {
        var pumpName = scope.dataset.pumpName;
        var overrideEl = pumpName ? document.getElementById('override-' + pumpName) : null;
        payload.approve_safety_override = !!(overrideEl && overrideEl.checked);
      }
      return payload;
    };

    window.deviceGroupManualApplyPayload = function(applyBtn) {
      var scope = applyBtn.closest('.manual-control-scope');
      var mode = scope && scope.dataset.pendingMode ? scope.dataset.pendingMode : 'manual_on';
      var payload = window.manualPayloadFromScope(scope, mode);
      if (scope) {
        payload.device_backend = scope.dataset.deviceBackend || '';
        payload.device_id = scope.dataset.deviceId || '';
      }
      return payload;
    };

    document.body.addEventListener('click', function(evt) {
      var cancelBtn = evt.target.closest('.manual-cancel-btn');
      if (cancelBtn) {
        evt.preventDefault();
        window.closeManualControlPanel(cancelBtn);
      }
    });
  })();
  </script>
</body>
</html>
