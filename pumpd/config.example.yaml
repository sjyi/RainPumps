timezone: America/New_York

location:
  latitude: 40.7128
  longitude: -74.0060
  name: ""
  address: ""

display:
  units: imperial   # imperial (°F, in) or metric (°C, mm)

weather:
  poll_minutes: 10
  current_poll_minutes: 10
  providers: [accuweather, open_meteo, nws]
  display_provider: accuweather

rules:
  evaluate_minutes: 10
  precip_probability_threshold: 70
  precip_amount_threshold_mm: 2.0
  lookahead_hours: 2
  post_rain_drain_minutes: 30
  sensor_dry_minutes: 10
  manual_revert_minutes: 5
  duty_cycle:
    enabled: false
    on_minutes: 10
    off_minutes: 20

safety:
  max_continuous_runtime_minutes: 180
  min_cooldown_minutes: 15
  watchdog_stale_forecast_hours: 3

pumps:
  - name: north_pump
    label: "North roof outlet"  # optional display name (Admin → Device & switch names)
    enabled: true
    tuya:
      device_id: ""
      ip: "192.168.1.50"
      local_key: ""
      version: 3.4
      switch_code: switch_1  # switch_2, switch_3 for multi-outlet plugs
    meross:
      device_uuid: ""       # from Admin → Import pumps (Meross cloud)
      channel: 0            # 0 = first outlet, 1 = second, …
      switch_code: switch_1
    smartthings:
      device_id: ""

notifications:
  # admin_email, public_base_url, and smtp settings: Admin → Email notifications
  public_base_url: "http://localhost:8080"
  admin_email: ""
  ntfy:
    enabled: true
    url: "https://ntfy.sh"
    topic: ""
  smtp:
    enabled: false
    host: ""
    port: 587
    username: ""
    from_addr: ""
    to_addrs: []

mqtt:
  enabled: false
  host: mosquitto
  port: 1883
  topic: sensors/rain
  min_confidence: 0.8

api:
  auth_enabled: false
  api_key: ""
  lock_timeout_seconds: 30

hardware_monitor:
  enabled: true
  sensor_stale_minutes: 15
  pump_failure_threshold: 3
  verify_mismatch_threshold: 2

logging:
  json: false

devices:
  # local = LAN first | cloud = Tuya/Meross cloud + SmartThings | auto = all paths
  control_mode: auto
  # Delay between turning on switch_2, switch_3, … on the same multi-outlet plug
  switch_stagger_seconds: 30
  command_verify_delay_seconds: 15
  command_verify_max_attempts: 3
  # Re-check pumps marked offline/unknown on this interval (0 = disabled)
  online_probe_recovery_minutes: 5

# Optional per-device max continuous runtime (minutes). Omitted switches inherit device, then system.
# device_runtime:
#   - device_backend: tuya
#     device_id: "your_device_id"
#     max_runtime_minutes: 120

# Optional cloud device display names (Admin → Device & switch names)
# device_labels:
#   - device_backend: tuya
#     device_id: "your_device_id"
#     label: "Roof east plug"

# Optional dashboard device group order (Admin → Device display order)
# device_display_order:
#   - device_backend: meross
#     device_id: "your_device_uuid"
#   - device_backend: meross
#     device_id: "another_device_uuid"

database_url: sqlite:///./data/pumpd.db
